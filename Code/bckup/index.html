<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GlideRise — Glove Materials Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ice:#EAF6FB;
    --frost:#FFFFFF;
    --navy:#0B2545;
    --steel:#4C6B8A;
    --accent:#4FC6DE;
    --blade:#C9D6DF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 80% -10%, #ffffff 0%, var(--ice) 55%, var(--ice) 100%);
    font-family:'Inter', sans-serif;
    color:var(--navy);
    display:flex;
    justify-content:center;
    padding:48px 20px;
  }
  .app{
    width:100%;
    max-width:640px;
  }
  header{
    position:relative;
    padding-bottom:22px;
    margin-bottom:22px;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .logo{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    background:var(--accent);
    box-shadow:0 8px 24px -18px rgba(79,198,222,.9);
    overflow:hidden;
  }
  .logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .logo.fallback{
    color:var(--frost);
    font-weight:700;
    font-size:14px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--steel);
    font-weight:600;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(32px, 5vw, 44px);
    margin:6px 0 8px;
    letter-spacing:.01em;
  }
  p.sub{
    color:var(--steel);
    margin:0;
    font-size:15px;
    max-width:46ch;
  }
  /* signature: a drawn skate-blade trail under the header */
  svg.blade{
    position:absolute;
    left:0; bottom:0;
    width:220px; height:20px;
    overflow:visible;
  }
  svg.blade path{
    fill:none;
    stroke:var(--accent);
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-dasharray:260;
    stroke-dashoffset:260;
    animation:draw 1.1s ease-out forwards .15s;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .card{
    background:var(--frost);
    border:1px solid var(--blade);
    border-radius:var(--radius);
    box-shadow:0 20px 40px -24px rgba(11,37,69,.25);
    overflow:hidden;
  }
  #log{
    height:420px;
    overflow-y:auto;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg{
    max-width:82%;
    padding:11px 14px;
    border-radius:12px;
    line-height:1.5;
    font-size:14.5px;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--navy);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg.bot{
    align-self:flex-start;
    background:var(--ice);
    color:var(--navy);
    border:1px solid var(--blade);
    border-bottom-left-radius:4px;
  }
  .msg.error{
    align-self:flex-start;
    background:#FCEAEA;
    color:#7A2323;
    border:1px solid #E9B6B6;
  }
  .msg.typing{ color:var(--steel); font-style:italic; }

  form{
    display:flex;
    gap:10px;
    border-top:1px solid var(--blade);
    padding:14px;
    background:var(--frost);
  }
  input[type=text]{
    flex:1;
    border:1px solid var(--blade);
    border-radius:10px;
    padding:11px 14px;
    font-size:14.5px;
    font-family:inherit;
    color:var(--navy);
    outline:none;
  }
  input[type=text]:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(79,198,222,.25);
  }
  button{
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:0 20px;
    font-size:14px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:opacity .15s;
  }
  button:disabled{ opacity:.5; cursor:default; }
  button:focus-visible, input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  details{ margin-top:16px; font-size:13px; color:var(--steel); }
  details input{
    margin-top:8px;
    width:100%;
    border:1px solid var(--blade);
    border-radius:8px;
    padding:8px 10px;
    font-family:inherit;
    font-size:13px;
    color:var(--navy);
  }

  @media (prefers-reduced-motion: reduce){
    svg.blade path{ animation:none; stroke-dashoffset:0; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand-row">
        <div class="logo" id="edgework-logo">
          <img src="GlideRiseGlove.png" alt="GlideRise logo" onerror="this.style.display='none'; this.parentNode.classList.add('fallback'); this.parentNode.textContent='G';" />
        </div>
        <div class="eyebrow">GlideRise</div>
      </div>
      <h1>Glove Materials Assistant</h1>
      <p class="sub">Ask about grip, warmth, and durability for synchronized figure skating gloves.</p>
      <svg class="blade" viewBox="0 0 220 20"><path d="M2 16 C 60 16, 90 2, 218 4" /></svg>
    </header>

    <div class="card">
      <div id="log">
        <div class="msg bot">Hi — ask me anything about glove materials for synchronized figure skating. For example: "What's the best material for grip in cold rinks?"</div>
      </div>
      <form id="chat-form">
        <input type="text" id="input" placeholder="Ask about glove materials…" autocomplete="off" required />
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>

    <details>
      <summary>API settings</summary>
      <input type="text" id="api-url" placeholder="https://your-api-host.example.com" />
    </details>
  </div>

<script>
  const DEFAULT_API_URL = "http://localhost:8000";
  const apiUrlInput = document.getElementById('api-url');
  apiUrlInput.value = localStorage.getItem('materialsApiUrl') || DEFAULT_API_URL;
  apiUrlInput.addEventListener('change', () => {
    localStorage.setItem('materialsApiUrl', apiUrlInput.value.trim());
  });

  const log = document.getElementById('log');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');

  function addMessage(text, cls){
    const div = document.createElement('div');
    div.className = `msg ${cls}`;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if(!message) return;

    addMessage(message, 'user');
    input.value = '';
    sendBtn.disabled = true;

    const typingEl = addMessage('Thinking…', 'bot typing');

    const apiUrl = (apiUrlInput.value.trim() || DEFAULT_API_URL).replace(/\/$/, '');

    try{
      const res = await fetch(`${apiUrl}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });

      if(!res.ok){
        const detail = await res.text();
        throw new Error(`API error ${res.status}: ${detail}`);
      }

      const data = await res.json();
      typingEl.remove();
      addMessage(data.reply, 'bot');
    }catch(err){
      typingEl.remove();
      addMessage(`Couldn't reach the assistant: ${err.message}`, 'error');
    }finally{
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
